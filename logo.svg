<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     role="img"
     aria-label="OmniCalc Logo">

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#020617"/>

  <!-- Outer Calculator Frame -->
  <rect x="124" y="88" width="264" height="336" rx="36" fill="#ffffff"/>

  <!-- Display -->
  <rect x="156" y="120" width="200" height="56" rx="12" fill="#020617"/>

  <!-- Infinity Symbol (Core Identity) -->
  <path
    d="M192 148
       C216 120, 256 120, 280 148
       C304 176, 344 176, 368 148"
    fill="none"
    stroke="#0ea5e9"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Button Grid -->
  <g fill="#020617">
    <rect x="156" y="208" width="56" height="56" rx="12"/>
    <rect x="228" y="208" width="56" height="56" rx="12"/>
    <rect x="300" y="208" width="56" height="56" rx="12"/>

    <rect x="156" y="280" width="56" height="56" rx="12"/>
    <rect x="228" y="280" width="56" height="56" rx="12"/>
    <rect x="300" y="280" width="56" height="56" rx="12"/>

    <rect x="156" y="352" width="128" height="44" rx="12"/>
    <rect x="300" y="352" width="56" height="44" rx="12"/>
  </g>

</svg>
